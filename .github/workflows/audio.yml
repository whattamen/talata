name: Gumawa ng audio (Tagalog)
on:
  workflow_dispatch:
    inputs:
      work:
        description: 'ID ng akda (hal. huling-tagapag-ingat). Iwanang blangko kung lahat.'
        required: false
      chapter:
        description: 'Numero ng kabanata (hal. 1). Iwanang blangko kung lahat.'
        required: false
      force:
        description: 'Gawing muli kahit may mp3 na (true/false)'
        required: false
        default: 'false'
permissions:
  contents: write
jobs:
  audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install edge-tts
      - name: Gumawa ng mp3
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.work }}" ]; then ARGS="$ARGS --work ${{ inputs.work }}"; else ARGS="$ARGS --all"; fi
          if [ -n "${{ inputs.chapter }}" ]; then ARGS="$ARGS --chapter ${{ inputs.chapter }}"; fi
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          python3 tools/make_audio.py $ARGS
      - name: I-commit ang audio
        run: |
          git config user.name "talata-audio"; git config user.email "audio@talata-studio.com"
          git add audio site-data.json
          git diff --cached --quiet || (git commit -m "Magdagdag ng audio" && git push)
